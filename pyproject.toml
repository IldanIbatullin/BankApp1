[tool.poetry]
name = "bankapp1"
version = "0.1.0"
description = ""
authors = ["Ildan Ibatullin <rustam162606@yandex.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
python-dotenv = "^1.1.0"
requests = "^2.32.3"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.2.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
    /(
        \.git
    )/
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119